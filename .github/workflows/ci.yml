name: Validate reader
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/app.mjs
          node --check src/corpus.mjs
          node --check src/card.mjs
          node --check scripts/audit-content.mjs
      - name: Test data integrity, parsing, search and image layout
        run: node --test tests/*.test.mjs
      - name: Audit content and attached source coverage
        run: node scripts/audit-content.mjs
